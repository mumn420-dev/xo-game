<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe (Human & Bot)</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --text-color: #f8fafc;
            --x-color: #f43f5e;
            --o-color: #38bdf8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            text-align: center;
            max-width: 350px;
            width: 100%;
            z-index: 10;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 1.8rem;
            color: var(--text-color);
        }

        .settings {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        select, button {
            padding: 10px;
            font-size: 1rem;
            border-radius: 8px;
            border: none;
            outline: none;
            cursor: pointer;
        }

        select {
            background-color: #334155;
            color: var(--text-color);
        }

        .btn-primary {
            background-color: var(--accent);
            color: #0f172a;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        #status {
            margin: 15px 0;
            font-size: 1.1rem;
            font-weight: 500;
            height: 30px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .cell {
            background-color: #334155;
            height: 90px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            user-select: none;
        }

        .cell:hover {
            background-color: #475569;
        }

        .cell.X {
            color: var(--x-color);
        }

        .cell.O {
            color: var(--o-color);
        }

        #winner-display {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(15, 23, 42, 0.95);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        #winner-display h2 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            color: var(--accent);
        }

        #congrats-image {
            width: 320px;
            max-width: 80vw;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
            border: 4px solid var(--accent);
        }

        .sprite-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
            overflow: hidden;
        }

        .sprite {
            position: absolute;
            top: -50px;
            font-size: 2rem;
            animation: fall linear infinite;
        }

        @keyframes fall {
            to {
                transform: translateY(105vh) rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <div class="container" id="game-container">
        <h1>Tic-Tac-Toe</h1>
        
        <div class="settings">
            <label for="gameMode">Select Mode:</label>
            <select id="gameMode">
                <option value="pvp">Human vs Human</option>
                <option value="pve">Human vs Bot</option>
                <option value="eve">Bot vs Bot</option>
            </select>
            <button class="btn-primary" onclick="startGame()">Start / Reset Game</button>
        </div>

        <div id="status">Choose a mode and click Start</div>

        <div class="board" id="board">
            <div class="cell" onclick="cellClicked(0)"></div>
            <div class="cell" onclick="cellClicked(1)"></div>
            <div class="cell" onclick="cellClicked(2)"></div>
            <div class="cell" onclick="cellClicked(3)"></div>
            <div class="cell" onclick="cellClicked(4)"></div>
            <div class="cell" onclick="cellClicked(5)"></div>
            <div class="cell" onclick="cellClicked(6)"></div>
            <div class="cell" onclick="cellClicked(7)"></div>
            <div class="cell" onclick="cellClicked(8)"></div>
        </div>
    </div>

    <div id="winner-display">
        <h2>Congratulations!</h2>
        <img id="congrats-image" src="IMG-20260728-WA0006.jpg" alt="Winner Certificate">
        <button class="btn-primary" onclick="resetToGame()">Play Again</button>
    </div>

    <div class="sprite-container" id="sprite-container"></div>

    <script>
        const statusElement = document.getElementById('status');
        const modeSelect = document.getElementById('gameMode');
        const winnerDisplay = document.getElementById('winner-display');
        const spriteContainer = document.getElementById('sprite-container');
        const gameContainer = document.getElementById('game-container');

        let board = ["", "", "", "", "", "", "", "", ""];
        let currentPlayer = "X";
        let isRunning = false;
        let gameMode = "pvp";
        let botInterval = null;
        let isCelebrationActive = false;

        const winConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8],
            [0, 3, 6], [1, 4, 7], [2, 5, 8],
            [0, 4, 8], [2, 4, 6]
        ];

        function startGame() {
            clearInterval(botInterval);
            resetToGame();
            board = ["", "", "", "", "", "", "", "", ""];
            currentPlayer = "X";
            isRunning = true;
            gameMode = modeSelect.value;
            
            updateBoardUI();
            statusElement.textContent = `Player ${currentPlayer}'s turn`;

            if (gameMode === "eve") {
                botInterval = setInterval(runBotTurn, 700);
            }
        }

        function cellClicked(index) {
            if (!isRunning || board[index] !== "") return;
            if (gameMode === "pve" && currentPlayer === "O") return;
            if (gameMode === "eve") return;

            makeMove(index, currentPlayer);
        }

        function makeMove(index, player) {
            board[index] = player;
            updateBoardUI();
            
            if (checkWinner(player)) {
                handleWin(player);
                return;
            }

            if (board.every(cell => cell !== "")) {
                statusElement.textContent = "It's a Draw!";
                isRunning = false;
                clearInterval(botInterval);
                return;
            }

            currentPlayer = currentPlayer === "X" ? "O" : "X";
            statusElement.textContent = (gameMode === "pve" && currentPlayer === "O") ? "Bot is thinking..." : `Player ${currentPlayer}'s turn`;

            if (gameMode === "pve" && currentPlayer === "O" && isRunning) {
                setTimeout(runBotTurn, 500);
            }
        }

        function runBotTurn() {
            if (!isRunning) return;
            const move = getSmartBotMove(currentPlayer);
            if (move !== -1) {
                makeMove(move, currentPlayer);
            }
        }

        function getSmartBotMove(botMark) {
            const humanMark = botMark === "X" ? "O" : "X";

            // 1. Win if possible
            for (let condition of winConditions) {
                let [a, b, c] = condition;
                if (board[a] === botMark && board[b] === botMark && board[c] === "") return c;
                if (board[a] === botMark && board[c] === botMark && board[b] === "") return b;
                if (board[b] === botMark && board[c] === botMark && board[a] === "") return a;
            }

            // 2. Block human win
            for (let condition of winConditions) {
                let [a, b, c] = condition;
                if (board[a] === humanMark && board[b] === humanMark && board[c] === "") return c;
                if (board[a] === humanMark && board[c] === humanMark && board[b] === "") return b;
                if (board[b] === humanMark && board[c] === humanMark && board[a] === "") return a;
            }

            // 3. Take center
            if (board[4] === "") return 4;

            // 4. Take random available spot
            const available = board.map((val, idx) => val === "" ? idx : null).filter(val => val !== null);
            if (available.length > 0) {
                return available[Math.floor(Math.random() * available.length)];
            }
            return -1;
        }

        function checkWinner(player) {
            return winConditions.some(condition => {
                return condition.every(index => board[index] === player);
            });
        }

        function updateBoardUI() {
            const cells = document.querySelectorAll('.cell');
            cells.forEach((cell, index) => {
                cell.textContent = board[index];
                cell.className = `cell ${board[index]}`;
            });
        }

        function handleWin(player) {
            isRunning = false;
            clearInterval(botInterval);

            let isHumanWinner = false;
            if (gameMode === "pvp") {
                statusElement.textContent = `Player ${player} Wins!`;
                isHumanWinner = true;
            } else if (gameMode === "pve") {
                if (player === "X") {
                    statusElement.textContent = "You Win!";
                    isHumanWinner = true;
                } else {
                    statusElement.textContent = "Bot Wins!";
                }
            } else {
                statusElement.textContent = `Bot (${player}) Wins!`;
            }

            if (isHumanWinner) {
                setTimeout(showWinnerDisplay, 700);
            }
        }

        function showWinnerDisplay() {
            isCelebrationActive = true;
            gameContainer.style.display = 'none';
            winnerDisplay.style.display = 'flex';
            startSprites();
        }

        function resetToGame() {
            isCelebrationActive = false;
            stopSprites();
            winnerDisplay.style.display = 'none';
            gameContainer.style.display = 'block';
            statusElement.textContent = "Choose a mode and click Start";
        }

        function startSprites() {
            spriteContainer.innerHTML = '';
            const symbols = ['🎈', '🎉', '🎊', '✨', '⭐'];
            
            for (let i = 0; i < 35; i++) {
                const sprite = document.createElement('div');
                sprite.className = 'sprite';
                sprite.textContent = symbols[Math.floor(Math.random() * symbols.length)];
                sprite.style.left = Math.random() * 100 + '%';
                sprite.style.animationDuration = (Math.random() * 3 + 3) + 's';
                sprite.style.animationDelay = (Math.random() * 3) + 's';
                sprite.style.fontSize = (Math.random() * 1.5 + 1.5) + 'rem';
                
                spriteContainer.appendChild(sprite);
            }
        }

        function stopSprites() {
            spriteContainer.innerHTML = '';
        }
    </script>
</body>
</html>
